name: Issue Triage

on:
  # Auto-triggers on Copilot-generated triage branches so the initial triage
  # runs as soon as this workflow is pushed (pending maintainer approval).
  # Remove this trigger after the initial triage is complete.
  push:
    branches:
      - 'copilot/**'
    paths:
      - 'scripts/issue_triage.py'
      - '.github/workflows/issue-triage.yml'
  # Manual trigger for on-demand re-runs (works from the default branch).
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print planned actions without applying them)'
        required: false
        default: 'false'
        type: boolean

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run issue triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python3 scripts/issue_triage.py
