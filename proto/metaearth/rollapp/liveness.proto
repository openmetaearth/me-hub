syntax = "proto3";
package metaearth.rollapp;

import "cosmos/base/v1beta1/coin.proto";
import "gogoproto/gogo.proto";
import "metaearth/rollapp/state_info.proto";

option go_package = "github.com/openmetaearth/me-hub/x/rollapp/types";

// LivenessEvent stores upcoming slash/jail actions on sequencers of rollapps
message LivenessEvent {
  reserved 3;
  // RollappId of relevant rollapp
  string rollapp_id = 1;
  // HubHeight when event will occur
  int64 hub_height = 2;
}
