syntax = "proto3";
package metaearth.kyc;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "google/protobuf/any.proto";
import "metaearth/did/did.proto";

option go_package = "github.com/openmetaearth/me-hub/x/kyc/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc Approve(MsgApprove) returns (MsgApproveResponse);
  rpc Update(MsgUpdate) returns (MsgUpdateResponse);
  rpc Remove(MsgRemove) returns (MsgRemoveResponse);

  rpc CreateSBT(MsgCreateSBT) returns (MsgCreateSBTResponse);
  rpc UpdateSBT(MsgUpdateSBT) returns (MsgUpdateSBTResponse);
  rpc DeleteSBT(MsgDeleteSBT) returns (MsgDeleteSBTResponse);

  rpc CreateSubAccount(MsgCreateSubAccount) returns (MsgCreateSubAccountResponse);

  // UpdateKycIssuer registers or removes KYC issuers. Only the Global DAO may
  // call it.
  rpc UpdateKycIssuer(MsgUpdateKycIssuer) returns (MsgUpdateKycIssuerResponse);
}

message MsgApprove {
  string issuer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string did = 2; // me-id
  string regionId = 3;
  string address = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string pubkey = 5;
  did.KycLevel level = 6;
  string uri = 7;
  string hash = 8;
  string inviter = 9 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgApproveResponse {}

message MsgUpdate {
  string issuer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string did = 2;
  string regionId = 3;
  did.KycLevel level = 4;
  string uri = 5;
  string hash = 6;
  string inviter = 7;
}

message MsgUpdateResponse {}

message MsgRemove {
  string issuer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string did = 2;
}

message MsgRemoveResponse {}

message MsgCreateSBT {
  string issuer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string did = 2;
  string uri = 3;
  string uriHash = 4;
  bytes data = 5;
}

message MsgCreateSBTResponse {}

message MsgUpdateSBT {
  string issuer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string did = 2;
  string uri = 3;
  string uriHash = 4;
  bytes data = 5;
}

message MsgUpdateSBTResponse {}

message MsgDeleteSBT {
  string issuer = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string did = 2;
}

message MsgDeleteSBTResponse {}

message MsgCreateSubAccount {
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string sub_account = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string sub_account_pubkey = 3;
}

message MsgCreateSubAccountResponse {}

// MsgUpdateKycIssuer updates the KYC service issuer list by account address.
message MsgUpdateKycIssuer {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "kyc/UpdateKycIssuer";
  // creator must be the Global DAO account.
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // addresses must have active, registered DIDs when adding issuers.
  repeated string addresses = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // option_type is 0 to add issuers or 1 to remove them.
  int32 option_type = 3;
}

// MsgUpdateKycIssuerResponse is returned after updating KYC issuers.
message MsgUpdateKycIssuerResponse {}
